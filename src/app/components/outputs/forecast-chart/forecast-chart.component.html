<section class="chart-wrap">
  <div class="toolbar">
    <div class="control-group">
      <strong>Scenario</strong>
      <mat-button-toggle-group
        [value]="selectedScenario()"
        (change)="scenarioChanged.emit($event.value)"
        aria-label="Scenario switcher"
      >
        <mat-button-toggle value="low">Low</mat-button-toggle>
        <mat-button-toggle value="medium">Medium</mat-button-toggle>
        <mat-button-toggle value="high">High</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <div class="control-group">
      <strong>Drawdown</strong>
      <mat-button-toggle-group
        [value]="selectedDrawdownPriority()"
        (change)="drawdownPriorityChanged.emit($event.value)"
        aria-label="Drawdown priority switcher"
      >
        <mat-button-toggle value="pension-first">Pension First</mat-button-toggle>
        <mat-button-toggle value="isa-first">ISA First</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <mat-checkbox
      [checked]="showOverlayLines()"
      (change)="showOverlayLines.set($event.checked)"
    >
      Show Withdrawal Lines
    </mat-checkbox>
  </div>

  <div echarts [options]="options()" class="chart"></div>
</section>
